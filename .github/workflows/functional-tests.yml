name: Functional tests and web smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Enforce PHP2Shell patched version in the test matrix
        run: |
          php -r '
          $minimum = ["8.3" => 80336, "8.4" => 80427, "8.5" => 80512];
          $branch = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
          if (!isset($minimum[$branch]) || PHP_VERSION_ID < $minimum[$branch]) {
              fwrite(STDERR, "Vulnerable PHP runtime: " . PHP_VERSION . PHP_EOL);
              exit(1);
          }
          echo "Patched runtime: " . PHP_VERSION . PHP_EOL;
          '
      - name: PHP syntax checks
        run: find PHP tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Functional PHP tests
        run: php tests/php_test.php

  javascript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: JavaScript syntax
        run: node --check JAVASCRIPT/fibonacci.js
      - name: Functional JavaScript tests
        run: node --test tests/javascript.test.cjs

  static:
    name: HTML and Nginx smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Static site tests (Python stdlib)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Run Nginx with repository configuration
        run: |
          docker run -d --name admision-web -p 8087:80 \
            -v "$PWD:/usr/share/nginx/html:ro" \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine
      - name: Verify HTML assets and HTTP security headers
        run: |
          curl --retry 12 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://localhost:8087/ >/dev/null
          for path in /PHP/index.html /JAVASCRIPT/index.html /JAVASCRIPT/fibonacci.js /CSS/index.html /CSS/style.css; do
            curl --fail --silent --show-error "http://localhost:8087$path" >/dev/null
          done
          curl --silent --show-error --head http://localhost:8087/ | grep -qi '^Content-Security-Policy:'
          curl --silent --show-error --head http://localhost:8087/ | grep -qi '^X-Content-Type-Options: nosniff'
      - name: Container logs
        if: failure()
        run: docker logs admision-web || true
      - name: Remove test container
        if: always()
        run: docker rm -f admision-web || true
