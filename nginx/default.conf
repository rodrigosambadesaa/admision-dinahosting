server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Allowlist of public assets. Never serve PHP code, Docker config or tests.
    # No PHP handler or upstream exists here: HTTP cannot invoke PHP.
    location = / {
        limit_except GET {
            deny all;
        }
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|PHP/index\.html|JAVASCRIPT/(index\.html|fibonacci\.js|styles\.css)|CSS/(index\.html|style\.css))$ {
        limit_except GET {
            deny all;
        }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
