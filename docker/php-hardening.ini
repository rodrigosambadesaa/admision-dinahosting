; PHP2Shell defense-in-depth only. An unpatched PHP runtime is NOT safe with ini flags.
; Applied before startup; this image installs no web PHP SAPI.
session.upload_progress.enabled = Off
file_uploads = Off
expose_php = Off
display_errors = Off
log_errors = On
session.use_strict_mode = On
; Resource safety after patch; finite limits are NOT a CVE mitigation.
memory_limit = 128M
