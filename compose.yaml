services:
  php-cli:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    # An isolated CLI process, not exposed as a PHP web SAPI.
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    command: php PHP/fibonacci.php "2026-06-01 00:00:00" "2026-06-30 23:59:59"

  web:
    image: nginx:stable-alpine
    ports:
      - "${WEB_PORT:-8087}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
